[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "roastery-etl"
version = "0.1.0"
description = "A coffee roastery's order pipeline"
requires-python = ">=3.15"

[project.scripts]
roastery-etl = "pipeline.cli:main"

[dependency-groups]
dev = ["mypy==2.4.0", "pytest==9.1.1", "ruff==0.17.2"]

[tool.setuptools]
packages = ["pipeline"]

[tool.mypy]
files = ["pipeline"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 79
