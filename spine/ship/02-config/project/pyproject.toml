[project]
name = "roastery-etl"
version = "0.1.0"
description = "October's order files in, a report and a warehouse out."
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
dev = ["mypy==2.4.0", "pytest==9.1.1", "ruff==0.17.1"]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project.scripts]
roastery-etl = "pipeline.cli:main"

[tool.setuptools]
packages = ["pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 80
