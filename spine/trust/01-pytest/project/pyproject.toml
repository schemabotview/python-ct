[project]
name = "roastery-etl"
version = "0.1.0"
description = "A coffee roastery's order pipeline"
requires-python = ">=3.15"

[dependency-groups]
dev = ["mypy==2.4.0", "pytest==9.1.1"]

[tool.mypy]
files = ["main.py", "pipeline"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
